# AI Agent 论文每日摘要 — 运行配置
# 密钥不要写在这里，只通过环境变量读取（见 .env.example）。

arxiv:
  # arXiv 官方 API 与 HTML 版本地址。测试时可指向本地 mock 服务。
  api_url: https://export.arxiv.org/api/query
  html_base: https://arxiv.org/html
  categories: [cs.AI, cs.CL, cs.MA, cs.LG]
  lookback_hours: 24        # 只保留 published（v1 提交时间）在此窗口内的论文
  page_size: 100            # 每次 API 请求的条数
  max_pages: 10             # 分页上限，防止异常时无限请求
  request_interval_sec: 3   # arXiv API 使用约定：两次请求之间至少间隔 3 秒
  timeout_sec: 30

filter:
  # 任一关键词命中 title 或 abstract 即保留（min_hits 可调高以收紧）。
  # 匹配规则：大小写不敏感；空格或连字符可互换（"tool use" 匹配 "tool-use"）；
  # 允许单词加 s/es 复数后缀；前后必须是单词边界。
  keywords:
    - agent
    - agentic
    - multi-agent
    - tool use
    - computer use
    - prompt injection
    - agent memory
    - evaluation
    - MCP
    - planning
  # 命中任一排除词则丢弃，例如 "agent" 类误伤较多时可加入 "reinforcement learning"。
  exclude_keywords: []
  fields: [title, abstract]
  min_hits: 1
  case_sensitive: false

scoring:
  model: claude-haiku-5-5   # 可被环境变量 SCORE_MODEL 覆盖
  max_papers: 0             # 最多打分的候选篇数（0 = 不限制）；调试时可用 --max-papers 覆盖
  batch_size: 10            # 每次 API 调用打分的论文数（分批调用，摊薄系统提示开销）
  abstract_max_chars: 1200  # 打分时每篇摘要的截断长度
  max_output_tokens: 1200   # 每批输出上限（每篇约 60 token 即可）
  effort: low               # output_config.effort，打分任务用 low 节省思考 token

reading:
  model: claude-sonnet-5-5  # 可被环境变量 READ_MODEL 覆盖
  top_k: 3                  # 精读篇数（按分数排序取前 K）
  max_input_chars: 15000    # 送入模型的论文正文上限（字符数，含摘要）
  max_output_tokens: 2000
  effort: medium
  # 精读时各章节在正文预算中的占比（按顺序填充）
  section_shares:
    introduction: 0.2
    method: 0.35
    experiments: 0.3
    conclusion: 0.15

budget:
  # 单次运行（每天一次）的 token 预算（输入+输出）。超出后跳过精读，只推送标题和链接。
  # 可被环境变量 DAILY_TOKEN_BUDGET 覆盖。
  daily_tokens: 300000

# 单价，单位：美元 / 百万 token。仅用于日志中的成本估算，请以官方定价为准并按需更新。
# 缓存读写未启用，因此只按 input_tokens / output_tokens 计费。
pricing_usd_per_mtok:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00

digest:
  dir: digests              # 存档目录，文件名为 YYYY-MM-DD.md
  title: AI Agent 论文日报
